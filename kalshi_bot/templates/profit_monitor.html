<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Profit Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
            color: #e0e0e0;
            padding: 20px;
            font-size: 14px;
            min-height: 100vh;
        }
        
        .header {
            margin-bottom: 24px;
            padding: 20px 24px;
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.15) 0%, rgba(80, 200, 120, 0.1) 100%);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        h1::before {
            content: '📊';
            font-size: 28px;
        }
        
        .status {
            font-size: 13px;
            color: #888;
            font-family: 'JetBrains Mono', monospace;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .status.active {
            color: #50c878;
            border-color: rgba(80, 200, 120, 0.3);
            background: rgba(80, 200, 120, 0.1);
        }
        
        .status.active::before {
            content: '● ';
            animation: pulse 2s infinite;
        }
        
        .status.inactive {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.3);
            background: rgba(255, 107, 107, 0.1);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .sets-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .set-section {
            background: linear-gradient(145deg, rgba(34, 34, 50, 0.8) 0%, rgba(26, 26, 46, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .set-section:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            border-color: rgba(74, 144, 226, 0.3);
        }
        
        .set-title {
            font-weight: 600;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(74, 144, 226, 0.3);
            color: #fff;
            font-size: 16px;
            letter-spacing: 0.5px;
        }
        
        .market-row {
            margin-bottom: 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .market-label {
            color: #888;
            font-weight: 500;
            min-width: 60px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .market-value {
            color: #fff;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(74, 144, 226, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
        }
        
        .orderbook-table {
            width: 100%;
            margin-top: 12px;
            font-size: 11px;
            border-collapse: separate;
            border-spacing: 0;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .orderbook-table tr {
            transition: background 0.2s ease;
        }
        
        .orderbook-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .orderbook-table td {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .orderbook-table td:first-child {
            color: #aaa;
            width: 45%;
            font-weight: 500;
        }
        
        .orderbook-table td:last-child {
            color: #fff;
            text-align: right;
            font-weight: 600;
            font-size: 12px;
        }
        
        .profit-row {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .profit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        
        .profit-item:hover {
            background: rgba(0, 0, 0, 0.3);
            transform: translateX(4px);
        }
        
        .profit-label {
            color: #aaa;
            font-weight: 500;
            font-size: 12px;
        }
        
        .profit-value {
            font-weight: 700;
            font-size: 16px;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s ease;
        }
        
        .profit-value.positive {
            color: #50c878;
            text-shadow: 0 0 10px rgba(80, 200, 120, 0.3);
        }
        
        .profit-value.negative {
            color: #ff6b6b;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
        }
        
        .profit-value.neutral {
            color: #888;
        }
        
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 16px;
            background: rgba(34, 34, 50, 0.5);
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        #setsContainer {
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        
        #setsContainer.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Kalshi Profit Monitor</h1>
        <div class="status inactive" id="status">Waiting...</div>
    </div>
    
    <div id="setsContainer">
        <div class="loading">Loading market data...</div>
    </div>
    
    <script>
        function extractValue(ticker) {
            // Extract the range/leg value from ticker
            // e.g., "KXBTC-26JAN1100-B90625" -> "B90625"
            // e.g., "KXBTCD-26JAN1100-T90499.99" -> "T90499.99"
            if (!ticker) return '-';
            const parts = ticker.split('-');
            return parts[parts.length - 1] || ticker;
        }
        
        function updateDisplay(data) {
            try {
                const statusEl = document.getElementById('status');
                if (data.last_update) {
                    const updateTime = new Date(data.last_update);
                    const now = new Date();
                    const diffMs = now - updateTime;
                    const diffSec = Math.floor(diffMs / 1000);
                    
                    let timeStr;
                    if (diffSec < 5) {
                        timeStr = 'Just now';
                    } else if (diffSec < 60) {
                        timeStr = `${diffSec}s ago`;
                    } else {
                        timeStr = data.last_update.split(' ')[1]; // Show time only
                    }
                    
                    statusEl.textContent = `Live • ${timeStr}`;
                    statusEl.className = 'status active';
                } else {
                    statusEl.textContent = 'Waiting for data...';
                    statusEl.className = 'status inactive';
                }
                
                const setsContainer = document.getElementById('setsContainer');
                if (!setsContainer) return;
                
                const sets = data.sets || [];
                if (sets.length === 0) {
                    setsContainer.innerHTML = '<div class="loading">No market data available</div>';
                    return;
                }
                
                let allHTML = '<div class="sets-container">';
                
                sets.forEach((setData, index) => {
                    const orderbooks = setData.orderbooks || {};
                    const profits = setData.profits || {};
                    const tickers = setData.tickers || {};
                    
                    let setHTML = `
                        <div class="set-section">
                            <div class="set-title">Set ${index + 1}</div>
                    `;
                    
                    // Market values
                    setHTML += `
                        <div class="market-row">
                            <span class="market-label">Range:</span>
                            <span class="market-value">${extractValue(tickers.range)}</span>
                        </div>
                        <div class="market-row">
                            <span class="market-label">Lower:</span>
                            <span class="market-value">${extractValue(tickers.lower)}</span>
                        </div>
                        <div class="market-row">
                            <span class="market-label">Higher:</span>
                            <span class="market-value">${extractValue(tickers.higher)}</span>
                        </div>
                    `;
                    
                    // Orderbook data (compact table)
                    const range_ob = orderbooks.range || {};
                    const lower_ob = orderbooks.lower || {};
                    const higher_ob = orderbooks.higher || {};
                    
                    setHTML += `
                        <table class="orderbook-table">
                            <tr><td>Range YES</td><td>${range_ob.yes_bid || 0}/${range_ob.yes_ask || 0}</td></tr>
                            <tr><td>Range NO</td><td>${range_ob.no_bid || 0}/${range_ob.no_ask || 0}</td></tr>
                            <tr><td>Lower YES</td><td>${lower_ob.yes_bid || 0}/${lower_ob.yes_ask || 0}</td></tr>
                            <tr><td>Lower NO</td><td>${lower_ob.no_bid || 0}/${lower_ob.no_ask || 0}</td></tr>
                            <tr><td>Higher YES</td><td>${higher_ob.yes_bid || 0}/${higher_ob.yes_ask || 0}</td></tr>
                            <tr><td>Higher NO</td><td>${higher_ob.no_bid || 0}/${higher_ob.no_ask || 0}</td></tr>
                        </table>
                    `;
                    
                    // Profits
                    const profit1 = profits.profit1 || 0;
                    const profit2 = profits.profit2 || 0;
                    const profit1Class = profit1 > 0 ? 'positive' : (profit1 < 0 ? 'negative' : 'neutral');
                    const profit2Class = profit2 > 0 ? 'positive' : (profit2 < 0 ? 'negative' : 'neutral');
                    
                    const profit1Icon = profit1 > 0 ? '📈' : profit1 < 0 ? '📉' : '➖';
                    const profit2Icon = profit2 > 0 ? '📈' : profit2 < 0 ? '📉' : '➖';
                    
                    setHTML += `
                        <div class="profit-row">
                            <div class="profit-item">
                                <span class="profit-label">${profit1Icon} Range YES Limit</span>
                                <span class="profit-value ${profit1Class}">${profit1 >= 0 ? '+' : ''}${profit1.toFixed(2)}¢</span>
                            </div>
                            <div class="profit-item">
                                <span class="profit-label">${profit2Icon} Range NO Limit</span>
                                <span class="profit-value ${profit2Class}">${profit2 >= 0 ? '+' : ''}${profit2.toFixed(2)}¢</span>
                            </div>
                        </div>
                    `;
                    
                    setHTML += '</div>';
                    allHTML += setHTML;
                });
                
                allHTML += '</div>';
                setsContainer.innerHTML = allHTML;
                
            } catch (error) {
                console.error('Error in updateDisplay:', error);
                const statusEl = document.getElementById('status');
                if (statusEl) {
                    statusEl.textContent = 'Error: ' + error.message;
                    statusEl.className = 'status inactive';
                }
            }
        }
        
        function fetchData() {
            fetch('/api/data')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    updateDisplay(data);
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    const statusEl = document.getElementById('status');
                    if (statusEl) {
                        statusEl.textContent = 'Error: ' + error.message;
                        statusEl.className = 'status inactive';
                    }
                });
        }
        
        // Fetch data every 500ms
        setInterval(fetchData, 500);
        
        // Initial fetch
        fetchData();
    </script>
</body>
</html>
