<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalshi Profit Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(90deg, #4A90E2, #50C878);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            text-align: center;
            color: #888888;
            margin-bottom: 30px;
            font-size: 0.9em;
        }
        
        .set-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .set-title {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #4A90E2;
            font-weight: bold;
            border-bottom: 2px solid rgba(74, 144, 226, 0.3);
            padding-bottom: 10px;
        }
        
        .orderbook-section {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #4A90E2;
            font-weight: bold;
        }
        
        .market-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #4A90E2;
        }
        
        .market-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
            color: #ffffff;
        }
        
        .ticker {
            color: #888888;
            font-size: 0.85em;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
        }
        
        .orderbook-data {
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            line-height: 1.6;
            color: #00ff00;
        }
        
        .profit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .profit-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid;
        }
        
        .profit-card.positive {
            border-left-color: #50C878;
        }
        
        .profit-card.negative {
            border-left-color: #FF6B6B;
        }
        
        .profit-card.neutral {
            border-left-color: #888888;
        }
        
        .profit-label {
            font-size: 0.9em;
            color: #888888;
            margin-bottom: 5px;
        }
        
        .profit-value {
            font-size: 1.8em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        
        .profit-card.positive .profit-value {
            color: #50C878;
        }
        
        .profit-card.negative .profit-value {
            color: #FF6B6B;
        }
        
        .profit-card.neutral .profit-value {
            color: #888888;
        }
        
        .status {
            text-align: center;
            color: #888888;
            font-size: 0.85em;
            margin-top: 20px;
        }
        
        .status.active {
            color: #50C878;
        }
        
        .status.inactive {
            color: #FF6B6B;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Kalshi Profit Monitor</h1>
        <div class="subtitle" id="lastUpdate">Waiting for data...</div>
        
        <div id="setsContainer"></div>
        
        <div class="status active" id="status">🟢 Connected</div>
    </div>
    
    <script>
        function updateDisplay(data) {
            // Update last update time
            document.getElementById('lastUpdate').textContent = 
                `Last Update: ${data.last_update || 'Never'}`;
            
            const setsContainer = document.getElementById('setsContainer');
            const sets = data.sets || [];
            
            // Clear container
            setsContainer.innerHTML = '';
            
            // Create HTML for each set
            sets.forEach((setData, index) => {
                const setNum = index + 1;
                const orderbooks = setData.orderbooks || {};
                const profits = setData.profits || {};
                const tickers = setData.tickers || {};
                
                let setHTML = `
                    <div class="set-section">
                        <div class="set-title">Set ${setNum}</div>
                `;
                
                // Orderbook section
                setHTML += `
                    <div class="orderbook-section">
                        <div class="section-title">Orderbook</div>
                `;
                
                const markets = [
                    {key: 'range', name: 'Range'},
                    {key: 'lower', name: 'Lower Leg'},
                    {key: 'higher', name: 'Higher Leg'}
                ];
                
                markets.forEach(market => {
                    const ob = orderbooks[market.key];
                    const ticker = tickers[market.key] || '-';
                    
                    setHTML += `
                        <div class="market-card">
                            <div class="market-name">${market.name}</div>
                            <div class="ticker">${ticker}</div>
                    `;
                    
                    if (ob && ob.yes_bid !== undefined) {
                        setHTML += `
                            <div class="orderbook-data">
                                YES Bid: ${String(ob.yes_bid || 0).padStart(3)} | YES Ask: ${String(ob.yes_ask || 0).padStart(3)} | Last: ${String(ob.last_price || 0).padStart(3)}<br>
                                NO Bid:  ${String(ob.no_bid || 0).padStart(3)} | NO Ask:  ${String(ob.no_ask || 0).padStart(3)}
                            </div>
                        `;
                    } else {
                        setHTML += '<div class="orderbook-data">No data</div>';
                    }
                    
                    setHTML += '</div>';
                });
                
                setHTML += '</div>'; // Close orderbook-section
                
                // Profit section
                setHTML += `
                    <div class="section-title">💰 Profit Opportunities</div>
                    <div class="profit-grid">
                `;
                
                const profitNames = [
                    {key: 'profit1', label: 'Profit 1 (Range YES limit)', color: '#4A90E2'},
                    {key: 'profit2', label: 'Profit 2 (Range NO limit)', color: '#50C878'}
                ];
                
                profitNames.forEach(profit => {
                    const value = profits[profit.key] || 0;
                    const cardClass = value > 0 ? 'positive' : (value < 0 ? 'negative' : 'neutral');
                    
                    setHTML += `
                        <div class="profit-card ${cardClass}">
                            <div class="profit-label">${profit.label}</div>
                            <div class="profit-value">${value.toFixed(2)}</div>
                        </div>
                    `;
                });
                
                setHTML += '</div>'; // Close profit-grid
                setHTML += '</div>'; // Close set-section
                
                setsContainer.innerHTML += setHTML;
            });
            
            // Update status
            const statusElement = document.getElementById('status');
            if (data.last_update) {
                statusElement.textContent = '🟢 Connected';
                statusElement.classList.remove('inactive');
                statusElement.classList.add('active');
            } else {
                statusElement.textContent = '🔴 Disconnected';
                statusElement.classList.remove('active');
                statusElement.classList.add('inactive');
            }
        }
        
        function fetchData() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    updateDisplay(data);
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('status').textContent = '🔴 Error';
                    document.getElementById('status').classList.remove('active');
                    document.getElementById('status').classList.add('inactive');
                });
        }
        
        // Fetch data every 500ms for faster updates
        setInterval(fetchData, 500);
        
        // Initial fetch
        fetchData();
    </script>
</body>
</html>
